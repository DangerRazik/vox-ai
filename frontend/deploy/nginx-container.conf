upstream vox_api {
    zone vox_api 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server api:8000 resolve;
}

server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    # Limit includes the complete multipart upload, not only the ZIP file.
    client_max_body_size 512m;
    client_body_timeout 300s;

    location = /vox { return 301 /vox/; }
    location /vox/api/v1/ {
        proxy_pass http://vox_api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location = /vox/index.html {
        add_header Cache-Control "no-cache" always;
    }
    location /vox/ { try_files $uri $uri/ /vox/index.html; }
    location / { return 404; }
}
